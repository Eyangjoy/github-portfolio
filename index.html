<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reianne Rodriguez | UI/UX Designer & Developer</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #b39ddb; /* Soft Lavender Accent */
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .bio {
            max-width: 650px;
            margin: 0 auto 1.5rem auto;
            color: var(--text-color);
        }

        .social-links a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 600;
        }

        .social-links a:hover {
            text-decoration: underline;
        }

        section {
            margin-bottom: 3rem;
        }

        h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .skill-tag {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .project-card h3 {
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        .project-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .project-tags {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .project-link {
            display: inline-block;
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .project-link:hover {
            color: var(--accent-color);
        }

        footer {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

        <h1>Reianne Rodriguez</h1>
        <p class="subtitle">UI/UX Designer & Mobile/Web Developer</p>
        <p class="bio">
            Passionate about crafting intuitive user interfaces, visual design assets, and functional web applications. 
            Currently seeking internship opportunities to create meaningful digital experiences.
        </p>
        <div class="social-links">

            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="mailto:your-email@example.com">Email Me</a>
        </div>
    </header>
